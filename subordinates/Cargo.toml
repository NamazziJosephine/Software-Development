[package]
name = "subordinates"
version = "0.1.0"
edition = "2024"

# src/recursive.rs and src/iterative.rs hold the two algorithms; src/lib.rs
# exposes them (and the shared tree-building) as modules; src/main.rs imports
# them via the library and runs one. The cses/ folder (outside the cargo build)
# holds flattened single-file copies for the CSES judge.
 
[dependencies]
 
[dev-dependencies]
criterion = "0.5"
 
[[bench]]
name = "subordinates"
harness = false
 
[profile.bench]
opt-level = 3
lto = true

