[package]
name = "finding-borders"
version = "0.1.0"
edition = "2024"

# src/kmp.rs and src/zalgo.rs hold the two algorithms; src/lib.rs exposes them
# as modules; src/main.rs imports them via the library and runs one. The cses/
# folder (outside the cargo build) holds flattened single-file copies for the
# CSES judge.
 
[dependencies]
 
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
 
[[bench]]
name = "finding_borders"
harness = false
 
[profile.bench]
opt-level = 3
lto = true
