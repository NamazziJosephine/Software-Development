[package]
name = "towers"
version = "0.1.0"
edition = "2024"

# src/btree.rs and src/patience.rs hold the two algorithms; src/lib.rs exposes
# them as modules; src/main.rs imports them via the library and runs one. The
# cses/ folder (outside the cargo build) holds flattened single-file copies for
# the CSES judge.

[dependencies]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "towers"
harness = false

[profile.bench]
opt-level = 3
lto = true

