[package]
name = "two-sets"
version = "0.1.0"
edition = "2024"

# src/greedy.rs and src/modular.rs hold the two algorithms; src/lib.rs exposes
# them as modules; src/main.rs imports them via the library and runs one.
# The cses/ folder (outside the cargo build) holds flattened single-file copies
# for the CSES judge, which accepts only one self-contained source file.
 
[dependencies]
 
[dev-dependencies]
criterion = "0.5"
 
[[bench]]
name = "two_sets"
harness = false
 
[profile.bench]
opt-level = 3
lto = true