[package]
name = "traffic-lights"
version = "0.1.0"
edition = "2024"

# src/bst.rs and src/offline.rs hold the two algorithms; src/lib.rs exposes them
# as modules; src/main.rs imports them via the library and runs one. The cses/
# folder (outside the cargo build) holds a flattened single-file copy for the
# CSES judge.
 
[dependencies]
 
[dev-dependencies]
criterion = "0.5"
 
[[bench]]
name = "traffic_lights"
harness = false
 
[profile.bench]
opt-level = 3
lto = true